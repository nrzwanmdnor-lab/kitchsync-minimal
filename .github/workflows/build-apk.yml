name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Prepare APK Output
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/KitchSync-Minimal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitchSync-Minimal-APK
          path: dist/KitchSync-Minimal.apk
          if-no-files-found: error

      - name: Create Release & Publish APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "KitchSync Minimal APK v1.1.0 - Dynamic Menu Master & Prominent Clear Action"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### 📱 KitchSync Minimal Android APK v1.1.0
            
            Android Kitchen Display System (KDS) and Catering Batch Aggregator for **Hjh Maimunah Restaurant Pte Ltd**.
            
            #### 🚀 Release Updates (v1.1.0)
            - **Dynamic Menu Master Management**:
              - Import custom `.csv` and `.json` menu files with strict V23 schema validation.
              - In-app CRUD editor: Add/Edit dish with custom ID, Station, and AC pricing matrix.
              - Discontinued item status flag and multi-select bulk item deletion.
              - One-tap "Reset to V23 Default" restoring embedded default menu.
            - **Order Ingestion & Tagging Schema**:
              - Automated parsing of Customer Name, Mobile Number, and Pax Count.
              - Format Tagging: `[AC]` Ala Carte, `[MBC]` Mini Buffet, `[LB]` Lunchbox, `[BSU]` Buffet Set Up, `[BB]` Bento Box.
              - Catering format rule: Customer & Mobile tags strictly bound for packing table & delivery dropoff reference. Pricing matrices and package splitting disabled for catering formats.
              - Dynamic Lead Buffers: Delivery − 120m for `BSU`, Delivery − 90m for `MBC`/`LB`/`BB`, Delivery − 45m for `AC`.
            - **High-Contrast Prominent CLEAR Button**:
              - Large, prominent green `✓ CLEAR TICKET` button on active order cards.
              - Bumps active ticket off live KDS and archives into Completed Prep History Log with one-tap restore.
            - **Dedicated Isolated Settings Page**:
              - Cleaned operational view, moving configurations into top-gear / bottom-bar Settings tab.
              - Network Thermal Printer Setup (LAN IP, Port 9100 RAW TCP, 80mm/58mm).
              - Ingestion Rules & OCR Fuzzy Confidence Threshold slider (default 75%).
            
            #### 📥 Download & Install
            Download **`KitchSync-Minimal.apk`** below and install directly on your Android device.
            
            #### 📲 Download & Installation
            Download the attached **`KitchSync-Minimal.apk`** below and install it directly on your Android device.
          files: dist/KitchSync-Minimal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
