plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kitchsync.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.kitchsync.app"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/INDEX.LIST'
            ]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.activity:activity:1.8.2'

    // Google ML Kit Text Recognition for photos/screenshots
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.android.gms:play-services-tasks:18.1.0'

    // Apache PDFBox-Android (PDF text stripper + OCR fallback)
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // Apache POI (XWPFDocument for .docx/.doc tables & paragraphs)
    implementation 'org.apache.poi:poi:5.2.5'
    implementation('org.apache.poi:poi-ooxml:5.2.5') {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xml-apis', module: 'xml-apis'
    }
    implementation('org.apache.poi:poi-scratchpad:5.2.5') {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xml-apis', module: 'xml-apis'
    }
    implementation 'com.fasterxml:aalto-xml:1.3.2'
}
