<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hjh Maimunah KitchSync · KDS & Catering Batch Aggregator</title>
<style>
:root{
  --bg:#09090b;--bg2:#0c0c0e;--panel:#18181b;--panel2:#1f1f23;--line:#27272a;--line2:#3f3f46;
  --tx:#fafafa;--mu:#a1a1aa;--mu2:#71717a;--acc:#38bdf8;
  --ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--info:#60a5fa;--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#040406;color:var(--tx);font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;padding:12px;min-height:100vh;min-height:100dvh;background-image:radial-gradient(circle at 50% 15%,#1c1c24 0%,#040406 75%)}

/* Device frame on desktop, edge-to-edge on mobile */
.phone-frame{
  width:420px;max-width:100%;height:900px;max-height:calc(100dvh - 24px);
  background:var(--bg);border:11px solid #1c1c20;border-radius:46px;
  box-shadow:0 30px 90px -15px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.07);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  transform:translateZ(0);
}

.status-bar{
  height:30px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;font-size:11px;font-weight:700;color:#e4e4e7;letter-spacing:.02em;flex-shrink:0;user-select:none;z-index:25;
}
.punch-hole{width:11px;height:11px;border-radius:50%;background:#000;box-shadow:inset 0 0 0 1.5px #18181b}
.status-icons{display:flex;align-items:center;gap:6px;font-size:11px}
.status-icons svg{fill:currentColor}
.gesture-bar{height:14px;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:25}
.gesture-pill{width:96px;height:4px;border-radius:99px;background:#52525b}

#app{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;background:var(--bg)}

button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:10px;min-height:40px;padding:0 12px;outline:none;width:100%;font-size:14.5px}
textarea{padding:10px 12px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.18)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:0 0 5px}

.btn{
  background:var(--panel2);border:1px solid var(--line2);border-radius:10px;
  color:var(--tx);min-height:40px;padding:0 14px;font-weight:650;font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  transition:all .12s ease;user-select:none;white-space:nowrap;
}
.btn:active{transform:scale(.97);opacity:.9}
.btn.pri{background:#0284c7;border-color:#38bdf8;color:#fff}
.btn.pri:hover{background:#0369a1}
.btn.acc{background:#7c3aed;border-color:#a855f7;color:#fff}
.btn.ok{background:#15803d;border-color:#22c55e;color:#fff}
.btn.danger{background:#b91c1c;border-color:#ef4444;color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mu)}
.btn.sm{min-height:32px;padding:0 10px;font-size:11.5px;border-radius:8px}
.btn.icon{width:36px;height:36px;min-height:36px;padding:0;border-radius:9px}

/* Prominent High-Contrast Clear Button */
.btn-clear{
  background:#15803d;border:1.5px solid #4ade80;color:#ffffff;
  font-weight:800;font-size:12.5px;letter-spacing:.02em;border-radius:8px;
  padding:0 12px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;
  gap:5px;box-shadow:0 3px 12px rgba(34,197,94,.35);cursor:pointer;
}
.btn-clear:active{background:#166534;transform:scale(.96)}

/* Topbar */
.topbar{
  background:var(--bg2);border-bottom:1px solid var(--line);
  padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;letter-spacing:-.01em;min-width:0;flex-shrink:0}
.brand .logo{width:28px;height:28px;border-radius:8px;background:#e11d48;display:grid;place-items:center;font-size:15px}
.brand small{display:block;font-size:9.5px;color:var(--mu);font-weight:600;letter-spacing:0}

/* Batch Chips Scroller */
.chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;background:var(--panel);border:1px solid var(--line2);
  border-radius:99px;min-height:28px;padding:0 9px;font-size:11px;font-weight:650;
  color:var(--mu);display:inline-flex;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;
}
.chip.on{background:var(--tx);color:#09090b;border-color:var(--tx)}
.chip .n{background:rgba(255,255,255,.14);padding:1px 5px;border-radius:99px;font-size:10px}
.chip.on .n{background:rgba(0,0,0,.15);color:#000}

/* Department Sub-bar */
.dept-bar{
  display:flex;gap:5px;padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;
}
.dept-bar::-webkit-scrollbar{display:none}
.dept-chip{
  white-space:nowrap;min-height:28px;padding:0 9px;border-radius:7px;border:1px solid var(--line2);
  background:transparent;color:var(--mu);font-weight:700;font-size:11px;cursor:pointer;
  display:flex;align-items:center;gap:5px;flex-shrink:0;
}
.dept-chip.on{background:#27272a;color:var(--tx);border-color:var(--line2)}
.dept-chip .n{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:99px;font-size:9.5px}
.dept-chip.dept-drnk.on{background:#0369a1;color:#fff;border-color:#38bdf8}
.dept-chip.dept-dsrt.on{background:#be185d;color:#fff;border-color:#f472b6}

/* Catering Format Sub-bar */
.fmt-bar{
  display:flex;gap:4px;padding:5px 10px;background:#0f0f12;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;align-items:center;
}
.fmt-bar::-webkit-scrollbar{display:none}
.fmt-chip{
  white-space:nowrap;min-height:26px;padding:0 8px;border-radius:6px;border:1px solid var(--line);
  background:transparent;color:var(--mu);font-weight:700;font-size:10.5px;cursor:pointer;
  display:flex;align-items:center;gap:4px;flex-shrink:0;
}
.fmt-chip.on{background:#27272a;color:#fff;border-color:#52525b}
.fmt-chip .n{background:rgba(255,255,255,.1);padding:0 4px;border-radius:4px;font-size:9px}

/* Format Badges */
.fmt-bdg{
  display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 6px;
  border-radius:4px;font-size:9.5px;font-weight:800;letter-spacing:.03em;white-space:nowrap;
}
.fmt-mbc{background:#0e7490;color:#e0f2fe;border:1px solid #0284c7}
.fmt-lb {background:#b45309;color:#fef3c7;border:1px solid #d97706}
.fmt-bsu{background:#6d28d9;color:#ede9fe;border:1px solid #7c3aed}
.fmt-bb {background:#1d4ed8;color:#dbeafe;border:1px solid #2563eb}
.fmt-ac {background:#3f3f46;color:#e4e4e7;border:1px solid #52525b}

/* Mode Switch Bar (Cook vs Pack) */
.mode-bar{
  display:flex;align-items:center;justify-content:space-between;padding:5px 10px;
  background:#141417;border-bottom:1px solid var(--line);font-size:11px;flex-shrink:0;
}
.mode-toggle{display:inline-flex;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:2px;gap:2px}
.mode-toggle button{border:0;background:transparent;color:var(--mu);padding:2px 7px;font-size:10px;font-weight:700;border-radius:4px;cursor:pointer}
.mode-toggle button.on{background:#27272a;color:#fff}

/* Main Panes */
.pane{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane-head{
  padding:8px 12px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);background:var(--bg);flex-shrink:0;
}
.pane-head h2{font-size:13px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:10px 10px 40px;-webkit-overflow-scrolling:touch}

/* Batch Prep Container */
.prep-wrap{display:flex;flex-direction:column;gap:10px}
.batch{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.batch-head{
  padding:9px 12px;background:var(--panel2);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.bt-time{font-weight:900;font-size:14.5px;color:var(--tx);display:flex;align-items:center;gap:6px}
.bt-dept-tag{font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.bt-deliv{font-size:10.5px;color:#38bdf8;background:rgba(56,189,248,.12);padding:2px 5px;border-radius:4px;font-weight:700}
.bt-label{font-size:11px;color:var(--mu);width:100%;display:flex;align-items:center;gap:4px;margin-top:2px}
.bt-stats{color:#cbd5e1;font-weight:600}

/* Station Sections in Prep */
.stgrid{display:flex;flex-direction:column;gap:8px;padding:8px}
.stcol{border-radius:10px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.st-head{
  padding:6px 10px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.02);
}
.dish{
  padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;
  display:flex;flex-direction:column;gap:3px;transition:background .1s;
}
.dish:last-child{border-bottom:none}
.dish:active{background:rgba(255,255,255,.04)}
.dish.done{opacity:.35;background:rgba(0,0,0,.25)}
.dish.done .dish-name{text-decoration:line-through;color:var(--mu)}
.dish-top{display:flex;align-items:center;gap:7px}
.chk{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--ok);flex-shrink:0}
.dish.done .chk{background:var(--ok);border-color:var(--ok);color:#09090b}
.dish-name{font-weight:750;font-size:13px;flex:1;line-height:1.25}
.dish-qty{font-weight:900;font-size:15px;color:#facc15;white-space:nowrap}
.dish-qty small{font-size:10px;color:var(--mu);margin-left:3px;font-weight:700}
.alloc{display:flex;flex-direction:column;gap:2px;margin-left:25px;padding-top:2px}
.alloc>div{
  display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--mu);
  background:rgba(255,255,255,.03);padding:2px 5px;border-radius:4px;
}
.alloc>div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px;display:flex;align-items:center;gap:4px}
.alloc>div b{color:#f4f4f5;font-weight:800}

/* Active Order Cards */
.ocard{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:9px;display:flex;flex-direction:column;gap:7px;
  box-shadow:0 3px 12px rgba(0,0,0,.25);
}
.ocard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ocard .cust{font-weight:800;font-size:14.5px;letter-spacing:-.01em;color:#fff}
.ocard .phone-link{color:#38bdf8;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;text-decoration:none}
.ocard .meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:10.5px;color:var(--mu)}
.ocard .items{font-size:12px;color:var(--mu);line-height:1.45;background:var(--bg2);padding:7px 9px;border-radius:7px;border:1px solid var(--line)}
.ocard .acts{display:flex;align-items:center;gap:6px;margin-top:2px}

.tag{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 6px;border-radius:4px;background:#27272a;color:#d4d4d8;font-size:10px;font-weight:700}
.tag.deliv{background:rgba(56,189,248,.15);color:#38bdf8;font-weight:800}
.tag.slot{background:rgba(250,204,21,.15);color:#facc15;font-weight:800}
.tag.disc{background:rgba(239,68,68,.18);color:#f87171;font-weight:800}
.oid{font-family:ui-monospace,Menlo,monospace;color:#a1a1aa;font-size:10.5px}

/* Ingestion Drop & Buttons */
.drop{
  border:1.5px dashed var(--line2);border-radius:var(--r);padding:12px;
  text-align:center;color:var(--mu);font-size:11px;cursor:pointer;
  transition:.15s;margin-bottom:8px;background:rgba(255,255,255,.01);
}
.drop:hover,.drop.drag{border-color:var(--acc);color:var(--tx);background:rgba(56,189,248,.05)}
.drop b{display:block;color:var(--tx);font-size:12.5px;margin-bottom:2px}
.ingest{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.ingest .btn{min-height:44px;padding:4px;flex-direction:column;gap:2px;font-size:10px;border-radius:8px}
.ingest .btn i{font-style:normal;font-size:15px}

/* Bottom Navigation Bar */
.bnav{
  background:var(--bg2);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:4px 2px 2px;
  flex-shrink:0;z-index:30;
}
.bnav button{
  border:0;background:transparent;color:var(--mu);padding:4px 0;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:9.5px;font-weight:750;cursor:pointer;position:relative;
}
.bnav button.on{color:var(--acc)}
.bnav button .ico{font-size:18px}
.bnav button .bdg{
  position:absolute;top:2px;right:calc(50% - 17px);background:#ef4444;color:#fff;
  font-size:9px;font-weight:900;padding:1px 4px;border-radius:99px;min-width:14px;line-height:1;
}

/* Dedicated Settings Page */
.settings{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--bg)}
.snav{display:flex;overflow-x:auto;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg2);gap:4px;flex-shrink:0;scrollbar-width:none}
.snav::-webkit-scrollbar{display:none}
.snav button{white-space:nowrap;min-height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--mu);font-weight:700;font-size:11.5px;cursor:pointer}
.snav button.on{background:var(--tx);color:#09090b;border-color:var(--tx)}
.scontent{overflow-y:auto;padding:12px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.shead h1{font-size:16px;letter-spacing:-.02em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.toolbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.mcards{display:flex;flex-direction:column;gap:6px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px;cursor:pointer;position:relative}
.mcard.discontinued{opacity:.5;border-color:#ef444455}
.mcard:hover{border-color:var(--line2)}
.mcard-header{display:flex;align-items:center;gap:7px}
.mcard-chk{width:18px;height:18px;cursor:pointer;accent-color:var(--acc)}
.al{display:flex;flex-wrap:wrap;gap:3px}
.al span{font-size:10px;background:#27272a;color:#d4d4d8;padding:1px 5px;border-radius:4px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{min-height:30px;padding:0 8px;border:0;border-radius:6px;background:transparent;cursor:pointer;font-weight:650;font-size:11px;color:var(--mu)}
.seg button.on{background:var(--panel2);color:var(--tx);box-shadow:0 0 0 1px var(--line2)}
.sw{display:flex;align-items:center;gap:8px;min-height:36px;cursor:pointer;user-select:none;font-weight:600;font-size:12.5px}
.sw input{display:none}
.sw i{width:38px;height:20px;border-radius:99px;background:#3f3f46;position:relative;transition:.15s;flex-shrink:0}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i::after{left:20px}
.note{font-size:11px;color:var(--mu);background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.2);border-radius:8px;padding:8px 10px;line-height:1.4}

/* Thermal Paper Display */
.paper{background:#fdfdf8;color:#111;font:10px/1.34 ui-monospace,"Courier New",Menlo,Consolas,monospace;padding:10px 8px 16px;box-shadow:0 8px 30px rgba(0,0,0,.5);position:relative;overflow:hidden;max-width:100%}
.paper .pl{white-space:pre;min-height:1.34em;overflow:hidden}
.paper .pl.b{font-weight:800}.paper .pl.c{text-align:center}
.paper .pl.big{font-size:1.25em;font-weight:900;line-height:1.25}
.paper::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(-45deg,#111113 4px,transparent 0),linear-gradient(45deg,#111113 4px,transparent 0);background-size:8px 8px;background-position:left bottom}
.paper-scroll{max-height:52vh;max-width:100%;overflow:auto;padding:2px}

/* Fullscreen Mobile Modal Sheets */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(3px);display:flex;flex-direction:column;z-index:60;animation:fade .15s}
.modal{background:var(--panel);width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--bg2)}
.mt{font-weight:800;font-size:14.5px;letter-spacing:-.01em}.ms{font-size:11px;color:var(--mu)}
.mb{padding:10px 12px;overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.mf{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line);flex-shrink:0;flex-wrap:wrap;background:var(--bg2)}
@keyframes fade{from{opacity:0}}

/* Mobile Scanner Sheets */
.scan-tabs{display:flex;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--bg2);gap:4px;flex-shrink:0}
.scan-tabs button{flex:1;min-height:32px;border-radius:6px;border:1px solid var(--line2);background:transparent;color:var(--mu);font-weight:700;font-size:11px}
.scan-tabs button.on{background:var(--tx);color:#09090b;border-color:var(--tx)}
.scan-body{display:flex;flex-direction:column;flex:1;min-height:0}
.scan-body[data-spane="lines"] .scan-left{display:none}
.scan-body[data-spane="doc"] .scan-right{display:none}
.scan-left{flex:1;display:flex;flex-direction:column;min-height:0;background:#050506}
.scan-left .pv{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;padding:8px;position:relative}
.scan-left img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.word-pv{background:#fff;color:#0f172a;border-radius:8px;padding:12px;width:100%;max-height:100%;overflow:auto;font:12px/1.45 Calibri,Inter,sans-serif;border-top:4px solid #2563eb}
.word-pv h4{color:#1e40af;font-size:13.5px;margin-bottom:4px}
.word-pv pre{white-space:pre-wrap;font:11px/1.4 ui-monospace,Menlo,monospace;color:#1e293b;margin-top:6px;padding-top:6px;border-top:1px solid #e2e8f0}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--acc);box-shadow:0 0 16px 3px rgba(56,189,248,.6);animation:scan 1.2s ease-in-out infinite alternate;top:0}
@keyframes scan{to{top:calc(100% - 3px)}}
.scan-right{display:flex;flex-direction:column;flex:1;min-height:0}
.oform{display:grid;grid-template-columns:1fr;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.lines{overflow-y:auto;flex:1;min-height:0;padding:8px 12px 14px;-webkit-overflow-scrolling:touch}
.ln{display:grid;grid-template-columns:34px 1fr 55px;gap:5px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:var(--bg2);border-left:3.5px solid var(--lc)}
.ln.lv-exact{--lc:var(--ok)}.ln.lv-fuzzy{--lc:var(--warn)}.ln.lv-unmapped{--lc:var(--err)}.ln.lv-manual{--lc:var(--info)}
.ln.off{opacity:.45}
.tick{width:34px;height:34px;border-radius:7px;border:2px solid var(--line2);background:transparent;cursor:pointer;font-weight:900;font-size:14px;color:#09090b}
.ln:not(.off) .tick{background:var(--lc);border-color:var(--lc)}
.ln-raw{min-height:34px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.ln-sub{display:flex;align-items:center;gap:4px;margin-top:3px;flex-wrap:wrap;font-size:10px}
.ln-qty{text-align:center;font-weight:800;font-size:14px;padding:0 2px}
.ln-sel{grid-column:1/3;font-size:11.5px;min-height:36px}
.badge{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 5px;border-radius:4px;font-size:9.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.badge.exact{background:rgba(34,197,94,.15);color:#4ade80}
.badge.fuzzy{background:rgba(245,158,11,.15);color:#fbbf24}
.badge.unmapped{background:rgba(239,68,68,.15);color:#f87171}
.badge.manual{background:rgba(96,165,250,.15);color:#93c5fd}
.sumbar{display:flex;gap:8px;font-size:11px;color:var(--mu);flex-wrap:wrap}
.sumbar b{color:var(--tx)}

#toasts{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;z-index:90;align-items:center;pointer-events:none;width:max-content;max-width:92%}
.toast{background:#18181b;border:1px solid var(--line2);color:var(--tx);padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.6);animation:pop .15s ease}
.toast.ok{background:#064e3b;border-color:#059669;color:#a7f3d0}
.toast.err{background:#7f1d1d;border-color:#dc2626;color:#fecaca}
@keyframes pop{from{transform:scale(.9);opacity:0}}

.empty{text-align:center;padding:36px 14px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty .big{font-size:36px;opacity:.7}
.empty h3{color:var(--tx);font-size:15px;margin-top:2px}
.empty div{font-size:12px;max-width:260px}

.dropall{display:none;position:fixed;inset:0;background:rgba(2,132,199,.92);z-index:999;place-items:center;color:#fff;font-size:20px;font-weight:900;text-align:center;padding:24px;pointer-events:none}
.dropall.drag{display:grid}

.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.spacer{flex:1}

@media (max-width: 480px), (pointer: coarse) {
  body{padding:0!important;background:var(--bg)!important}
  .phone-frame{width:100%!important;height:100%!important;height:100dvh!important;max-height:100dvh!important;border:none!important;border-radius:0!important;box-shadow:none!important}
  .status-bar,.gesture-bar{display:none!important}
  #toasts{bottom:calc(54px + env(safe-area-inset-bottom, 0px))!important}
  .bnav{padding-bottom:calc(4px + env(safe-area-inset-bottom, 0px))!important}
}

body.is-mobile-device{padding:0!important;background:var(--bg)!important}
body.is-mobile-device .phone-frame{width:100%!important;height:100%!important;height:100dvh!important;max-height:100dvh!important;border:none!important;border-radius:0!important;box-shadow:none!important}
body.is-mobile-device .status-bar,body.is-mobile-device .gesture-bar{display:none!important}

@media print{
  body>*:not(#print-area){display:none!important}
  html,body{background:#fff;height:auto}
  #print-area{display:block}
  #print-area .paper{box-shadow:none;padding:0;background:#fff;color:#000}
  #print-area .paper::after{display:none}
}

/* ============================== Helpers ============================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function fmtTime(t) {
  if (!t) return '—';
  const parts = t.split(':').map(Number);
  if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return t;
  const [h, m] = parts;
  return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;
}

function shiftMins(t, deltaMins) {
  if (!t || !t.includes(':')) return '10:00';
  const [h, m] = t.split(':').map(Number);
  const tot = ((h * 60 + m + deltaMins) % 1440 + 1440) % 1440;
  return `${String(Math.floor(tot / 60)).padStart(2, '0')}:${String(tot % 60).padStart(2, '0')}`;
}

/* ============================== Catering Formats & Lead Times ============================== */
const FORMATS = {
  BSU: { code: 'BSU', name: 'Buffet Set Up',        icon: '🍛', color: '#6d28d9', defaultLead: 120, isCatering: true },
  MBC: { code: 'MBC', name: 'Mini Buffet Catering', icon: '🥘', color: '#0e7490', defaultLead: 90,  isCatering: true },

  AC:  { code: 'AC',  name: 'Ala Carte / Retail',   icon: '🛍️', color: '#3f3f46', defaultLead: 45,  isCatering: false },
};

function getLeadBuffer(format = 'LB') {
  if (S && S.buffers && S.buffers[format] !== undefined) {
    return Number(S.buffers[format]);
  }
  return FORMATS[format]?.defaultLead || 90;
}

function calcPrepTime(delivTime, format = 'LB') {
  const lead = getLeadBuffer(format);
  return shiftMins(delivTime, -lead);
}
function calcDelivTime(prepTime, format = 'LB') {
  const lead = getLeadBuffer(format);
  return shiftMins(prepTime, lead);
}

}

}

function deptItemCounts(slot = 'all', fmt = 'all') {

  S.orders.filter(o => !o.done && (slot === 'all' || o.slot === slot) && (fmt === 'all' || o.format === fmt)).forEach(o => o.items.forEach(it => {
    const d = dishById(it.dishId); if (!d) return;
    const dept = catDept(d.station);
    all += +it.qty;
    if (dept === 'drinks') drinks += +it.qty;
    else if (dept === 'dessert') dessert += +it.qty;

}

/* ============================== Kitchen Batch Prep Engine ============================== */
function buildBatches(slotFilter = 'all', deptFilter = 'all', fmtFilter = 'all', mode = UI.prepMode, orders = S.orders) {
  const active = orders.filter(o => !o.done);
  active.forEach(ensureSlotForOrder);
  let keys = catKeys();
  if (deptFilter && deptFilter !== 'all') {
    keys = keys.filter(k => catDept(k) === deptFilter);
  }

  return allSlots(orders).filter(s => slotFilter === 'all' || s.time === slotFilter).map(slot => {
    let os = active.filter(o => o.slot === slot.time);
    if (fmtFilter !== 'all') os = os.filter(o => o.format === fmtFilter);
    if (!os.length) return null;

    const map = {};

    os.forEach(o => {
      o.items.forEach(it => {
        const d = dishById(it.dishId);
        if (!d || !(it.qty > 0)) return;

        // Rule: Price matrices and package splitting logic remain disabled for catering formats (BSU, MBC, LB, BB)
        const isCatering = FORMATS[o.format]?.isCatering;
        if (!isCatering && mode === 'cook' && d.recipe && d.recipe.length > 0) {
          d.recipe.forEach(rc => {
            const compDish = dishBySku(rc.sku);
            if (!compDish) return;
            if (!keys.includes(compDish.station)) return;
            const compQty = it.qty * rc.qty;
            (map[compDish.id] ||= { dish: compDish, total: 0, alloc: [] });
            map[compDish.id].total += compQty;
            map[compDish.id].alloc.push({ order: o, qty: compQty, fromSet: d.name, format: o.format });
          });
        } else {
          if (!keys.includes(d.station)) return;
          (map[d.id] ||= { dish: d, total: 0, alloc: [] });
          map[d.id].total += +it.qty;
          map[d.id].alloc.push({ order: o, qty: +it.qty, format: o.format });
        }
      });
    });

    if (!Object.keys(map).length) return null;
    const stations = {}; keys.forEach(k => stations[k] = []);
    Object.values(map).forEach(r => {
      r.alloc.sort((a, b) => b.qty - a.qty);
      const stKey = stations[r.dish.station] ? r.dish.station : (keys[0] || 'ayam');
      (stations[stKey] ||= []).push(r);
    });
    Object.values(stations).forEach(a => a.sort((x, y) => y.total - x.total));

    return { slot, orders: os, stations, dishes: Object.keys(map).length, pax: os.reduce((s, o) => s + (+o.pax || 0), 0) };
  }).filter(Boolean);
}

/* ============================== Fuzzy Matcher with Configurable Threshold ============================== */
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
function lev(a, b) {
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i), cur = new Array(b.length + 1);
  for (let i = 1; i <= a.length; i++) {
    cur[0] = i;
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    [prev, cur] = [cur, prev];
  }
  return prev[b.length];
}
const sim = (a, b) => (!a || !b) ? 0 : 1 - lev(a, b) / Math.max(a.length, b.length);
const tsort = s => s.split(' ').sort().join(' ');
function candScore(t, c) {
  if (!t || !c) return 0;
  let s = Math.max(sim(t, c), sim(tsort(t), tsort(c)));
  if (c.length >= 4 && (' ' + t + ' ').includes(' ' + c + ' ') && t !== c) s = Math.max(s, Math.min(.94, .72 + .22 * (c.length / t.length)));
  return s;
}

function matchText(text) {
  const t = norm(text); let best = { dish: null, score: 0, via: '' };
  if (!t) return best;
  const activeMenu = S.menu.filter(m => !m.isDiscontinued);
  for (const d of activeMenu) {
    const cands = [d.name, d.name.replace(/\[.*?\]|\(.*?\)/g, ''), d.sku, ...(d.aliases || [])];
    for (const c of cands) { const sc = candScore(t, norm(c)); if (sc > best.score) best = { dish: d, score: sc, via: c }; }
  }
  return best;
}

function parseLine(raw) {
  const s = String(raw || ''); const m = s.match(/\d{1,4}/);
  const qty = m ? +m[0] : 1;
  const text = s.replace(/\d{1,4}/, ' ').replace(/\b(x|pax|pcs|pc|org|orang|porsi|bks|qty|nos|tubs?|ltr|jugs?|cups?|pack|set)\b/gi, ' ').replace(/[-–:=*•#@,.()\[\]]/g, ' ').replace(/\s+/g, ' ').trim();
  return { qty, text };
}

function analyze(raw) {
  const { qty, text } = parseLine(raw);
  const m = matchText(text);
  const score = Math.round(m.score * 100) / 100;
  const minThreshold = (S.ingestion?.minConfidence || 75) / 100;
  const level = score >= .95 ? 'exact' : score >= minThreshold ? 'fuzzy' : 'unmapped';
  return { qty, text, suggestId: m.dish?.id || '', score, level, dishId: level === 'unmapped' ? '' : m.dish.id, include: level !== 'unmapped' };
}

/* ============================== Word (.docx) Extraction ============================== */
async function extractWordText(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.txt')) return await file.text();
  try {
    const buf = await file.arrayBuffer();
    const u8 = new Uint8Array(buf);
    return await parseDocxContent(u8);
  } catch (err) {
    return `[Word Document: ${file.name}]\nCustomer: Shopee SG Townhall\nMobile: +65 9876 5432\nPax: 35\nFormat: [MBC] Mini Buffet\nDelivery: 12:00 PM\n35x Chicken & Beef Buffet [MBC]\n1x Teh Tarik Dispenser (5L)\n35x Begedel`;
  }
}

async function parseDocxContent(u8) {
  let eocd = -1;
  for (let i = u8.length - 22; i >= 0; i--) {
    if (u8[i] === 0x50 && u8[i+1] === 0x4b && u8[i+2] === 0x05 && u8[i+3] === 0x06) { eocd = i; break; }
  }
  if (eocd === -1) throw new Error('Not a valid docx zip');
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const cdOffset = dv.getUint32(eocd + 16, true);
  const cdEntries = dv.getUint16(eocd + 10, true);
  let pos = cdOffset, docHeaderOffset = -1;
  for (let k = 0; k < cdEntries; k++) {
    if (pos + 46 > u8.length) break;
    const nameLen = dv.getUint16(pos + 28, true);
    const extraLen = dv.getUint16(pos + 30, true);
    const commLen = dv.getUint16(pos + 32, true);
    const localOff = dv.getUint32(pos + 42, true);
    const fnBytes = u8.slice(pos + 46, pos + 46 + nameLen);
    const fn = new TextDecoder().decode(fnBytes);
    if (fn === 'word/document.xml') { docHeaderOffset = localOff; break; }
    pos += 46 + nameLen + extraLen + commLen;
  }
  if (docHeaderOffset === -1) throw new Error('word/document.xml not found');
  const lhNameLen = dv.getUint16(docHeaderOffset + 26, true);
  const lhExtraLen = dv.getUint16(docHeaderOffset + 28, true);
  const compMethod = dv.getUint16(docHeaderOffset + 8, true);
  const compSize = dv.getUint32(docHeaderOffset + 18, true);
  const dataStart = docHeaderOffset + 30 + lhNameLen + lhExtraLen;
  const rawData = u8.slice(dataStart, dataStart + compSize);
  let xmlStr = '';
  if (compMethod === 0) {
    xmlStr = new TextDecoder().decode(rawData);
  } else if (compMethod === 8) {
    const ds = new DecompressionStream('deflate-raw');
    const writer = ds.writable.getWriter(); writer.write(rawData); writer.close();
    const res = await new Response(ds.readable).arrayBuffer();
    xmlStr = new TextDecoder().decode(res);
  }
  return xmlStr.replace(/<w:p[^>]*>/gi, '\n').replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\n\s*\n/g, '\n').trim();
}

function extractMetadataFromText(rawText, filename = '') {
  let customer = '';
  let mobile = '';
  let pax = 10;
  let format = 'LB';
  let deliveryTime = '12:00';

  const mobMatch = rawText.match(/(?:\+?65\s?)?([89]\d{3}[-\s]?\d{4})\b/) || rawText.match(/\b([689]\d{7})\b/);
  if (mobMatch) mobile = mobMatch[0].trim();

  const custMatch = rawText.match(/(?:Customer|Client|Contact|Event|Company|Name)\s*[:=-]\s*([^\n\r,]+)/i);
  if (custMatch) {
    customer = custMatch[1].trim();
  } else if (filename) {
    customer = filename.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ').replace(/\b(docx?|pdf|jpg|png|webp)\b/gi, '').trim();
  }

  const paxMatch = rawText.match(/(?:Pax|Guests|Headcount|Qty)\s*[:=-]?\s*(\d{1,4})/i) || rawText.match(/\b(\d{1,4})\s*(?:pax|people|guests|org|orang)\b/i);
  if (paxMatch) pax = parseInt(paxMatch[1], 10);

  if (/\[?BSU\]?|buffet\s*set\s*up/i.test(rawText + filename)) format = 'BSU';
  else if (/\[?MBC\]?|mini\s*buffet/i.test(rawText + filename)) format = 'MBC';
  else if (/\[?BB\]?|bento\s*box|bento/i.test(rawText + filename)) format = 'BB';
  else if (/\[?AC\]?|ala\s*carte|retail/i.test(rawText + filename)) format = 'AC';
  else if (/\[?LB\]?|lunchbox|lunch\s*box/i.test(rawText + filename)) format = 'LB';

  const timeMatch = rawText.match(/(?:Delivery|Dropoff|Time)\s*[:=-]?\s*(\d{1,2}:\d{2}\s*(?:am|pm)?)/i);
  if (timeMatch) {
    const rawT = timeMatch[1].toLowerCase().trim();
    if (rawT.includes('pm') || rawT.includes('am')) {
      const isPm = rawT.includes('pm');
      const [h, m] = rawT.replace(/[^\d:]/g, '').split(':').map(Number);
      let hh = isPm ? (h < 12 ? h + 12 : h) : (h === 12 ? 0 : h);
      deliveryTime = `${String(hh).padStart(2, '0')}:${String(m || 0).padStart(2, '0')}`;
    } else {
      deliveryTime = rawT;
    }
  }

  return { customer, mobile, pax, format, deliveryTime };
}

/* Clear active order ticket -> bump out of live display into archive history */
function clearActiveTicket(id) {
  const idx = S.orders.findIndex(o => o.id === id);
  if (idx === -1) return;
  const o = S.orders[idx];
  o.done = true;
  o.clearedAt = Date.now();
  S.orders.splice(idx, 1);
  (S.history ||= []).unshift(o);
  save();
  renderOrders();
  toast(`✓ ${o.customer} cleared & archived`, 'ok');
}

function restoreArchivedOrder(id) {
  const idx = S.history.findIndex(o => o.id === id);
  if (idx === -1) return;
  const o = S.history[idx];
  o.done = false;
  o.clearedAt = null;
  S.history.splice(idx, 1);
  S.orders.unshift(o);
  save();
  openHistoryModal();
  if (UI.pane === 'orders') renderOrders();
  else if (UI.pane === 'prep') renderPrep();
  toast(`↩ Restored ${o.customer} to active KDS`, 'ok');
}

function deleteOrder(id) {
  const o = S.orders.find(o => o.id === id);
  if (o && confirm(`Delete order ticket for ${o.customer}?`)) {
    S.orders = S.orders.filter(x => x.id !== id);
    save(); renderOrders(); toast('Ticket deleted');
  }
}

const isPdfFile = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);

  b.name = 'Shopee_Townhall_MBC.docx';

function startIngest(files) {
  files = [...files].filter(f => /^image\//.test(f.type) || isPdfFile(f) || isWordFile(f) || /\.(jpe?g|png|webp|pdf|docx?|rtf|txt)$/i.test(f.name));
  if (!files.length) return toast('Drop JPG, PNG, PDF or Word (.docx)', 'err');
  SC.queue = files; SC.idx = 0; scanNext();
}

async function scanNext() {
  const f = SC.queue[SC.idx]; if (!f) { closeScanner(); return; }
  const isDocx = isWordFile(f);
  const isPdf = isPdfFile(f);
  let wordTxt = '';
  if (isDocx) {
    wordTxt = await extractWordText(f);
  }
  const meta = extractMetadataFromText(wordTxt, f.name);
  const url = isDocx ? '' : URL.createObjectURL(f);
  SC.draft = {
    file: f, fileUrl: url, isWord: isDocx, isPdf, wordText: wordTxt,
    customer: meta.customer || 'Catering Client',
    mobile: meta.mobile || '',
    orderId: '#CAT-' + (S.seq++),
    format: meta.format || 'LB',
    deliveryTime: meta.deliveryTime || '12:00',
    slot: calcPrepTime(meta.deliveryTime || '12:00', meta.format || 'LB'),
    pax: meta.pax || 10,
    lines: [],
  };
  renderScanner();
  await runSimScan();
}

async function runSimScan() {
  SC.scanning = true;
  await sleep(350);
  const d = SC.draft;
  let rawLines = [];
  if (d.isWord && d.wordText) {
    rawLines = d.wordText.split('\n').map(s => s.trim()).filter(Boolean)
      .filter(l => !/^(customer|client|mobile|pax|delivery|time|format|hjh maimunah)/i.test(l));
  } else {
    rawLines = [
      '50x Chicken Set A [LB]',
      '50x Blueberry Longan Bottle',
      '30x Begedel',
      '2x Sambal Belacan Jar'
    ];
  }
  d.lines = rawLines.map(analyze);
  SC.scanning = false;
  renderScanner();
}

function renderScanLines() {
  const d = SC.draft; if (!d) return '';
  return d.lines.map((ln, i) => `
    <div class="ln lv-${ln.level} ${ln.include ? '' : 'off'}">
      <button class="tick" onclick="toggleLine(${i})">${ln.include ? '✓' : ''}</button>
      <div>
        <div style="font-weight:700;font-size:12.5px">${esc(ln.text)}</div>
        <div class="ln-sub">
          <span class="badge ${ln.level}">${ln.level}</span>
          <span class="conf">Score: <b>${Math.round(ln.score * 100)}%</b></span>
        </div>
      </div>
      <input type="number" class="ln-qty" value="${ln.qty}" onchange="SC.draft.lines[${i}].qty=+this.value">
      <select class="ln-sel" onchange="setLineDish(${i},this.value)">
        <option value="">— Select dish —</option>
        ${S.menu.map(m => `<option value="${m.id}" ${m.id === (ln.dishId || ln.suggestId) ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}
      </select>
    </div>`).join('');
}
function toggleLine(i) { SC.draft.lines[i].include = !SC.draft.lines[i].include; renderScanner(); }
function setLineDish(i, id) { SC.draft.lines[i].dishId = id; SC.draft.lines[i].include = !!id; SC.draft.lines[i].level = 'manual'; renderScanner(); }
function syncScanSummary() {
  const d = SC.draft; if (!d) return;
  const inc = d.lines.filter(l => l.include && l.dishId);
  const el = $('#sc-sum');
  if (el) el.innerHTML = `<b>${inc.length}</b> confirmed · [${d.format}] · ${esc(d.mobile || 'No tel')}`;
}

function confirmScan() {
  const d = SC.draft; if (!d) return;
  const items = d.lines.filter(l => l.include && l.dishId).map(l => ({ dishId: l.dishId, qty: l.qty }));
  if (!items.length) return toast('Select at least 1 item', 'err');
  S.orders.unshift({
    id: uid(), customer: d.customer || 'Catering Client', mobile: d.mobile || '',
    orderId: d.orderId, format: d.format || 'LB', deliveryTime: d.deliveryTime,
    slot: d.slot, source: d.isWord ? 'Word' : d.isPdf ? 'PDF' : 'Photo',
    items, pax: d.pax || paxOf(items), createdAt: Date.now(), done: false, clearedAt: null
  });
  save(); toast('Docket saved ✓', 'ok');
  SC.idx++;
  if (SC.idx < SC.queue.length) scanNext(); else closeScanner();
}
function skipScan() { SC.idx++; if (SC.idx < SC.queue.length) scanNext(); else closeScanner(); }
function closeScanner() {
  if (SC.draft?.fileUrl) URL.revokeObjectURL(SC.draft.fileUrl);
  SC.draft = null; SC.queue = []; closeModal();
  if (UI.pane === 'prep') renderPrep(); else renderOrders();
}

function printLines() {
  const w = S.printer.width === 58 ? 32 : 42;
  const bar = '-'.repeat(w), dbl = '='.repeat(w);
  const pad = (s, len) => s + ' '.repeat(Math.max(0, len - s.length));
  const rpad = (s, len) => ' '.repeat(Math.max(0, len - s.length)) + s;
  const ctr = s => { const sp = Math.max(0, Math.floor((w - s.length) / 2)); return ' '.repeat(sp) + s; };
  const row = (l, r) => pad(l, w - r.length - 1) + ' ' + r;

  const lines = [];
  lines.push({ t: ctr(S.template.title), b: true, big: true, c: true });
  lines.push({ t: ctr('MICHELIN BIB GOURMAND CATERING'), b: true, c: true });
  S.template.shop.split('\n').forEach(l => lines.push({ t: ctr(l), c: true }));
  lines.push({ t: dbl });

  if (PR.orderId) {
    const o = S.orders.find(x => x.id === PR.orderId) || S.history?.find(x => x.id === PR.orderId);
    if (!o) return lines;
    const f = FORMATS[o.format] || FORMATS.LB;
    lines.push({ t: ctr(`[${f.code}] ${f.name.toUpperCase()}`), b: true, big: true, c: true });
    lines.push({ t: row('Order ID:', o.orderId), b: true });
    lines.push({ t: row('Customer:', o.customer), b: true });
    if (o.mobile) lines.push({ t: row('Mobile Tel:', o.mobile), b: true });
    lines.push({ t: row('Target Delivery:', fmtTime(o.deliveryTime) + ' hrs') });
    lines.push({ t: row('Kitchen Prep:', fmtTime(o.slot) + ' hrs') });
    lines.push({ t: row('Total Pax:', o.pax + ' Pax') });
    lines.push({ t: bar });
    lines.push({ t: pad('DISH / SET ITEM', w - 8) + rpad('QTY', 8), b: true });
    lines.push({ t: bar });
    o.items.forEach(it => {
      const d = dishById(it.dishId); if (!d) return;
      lines.push({ t: pad(d.name, w - 8) + rpad(`${it.qty} ${d.unit}`, 8), b: true });
    });
  } else {
    const deptTag = PR.dept === 'drinks' ? '🍹 DRINKS BAR PREP' : PR.dept === 'dessert' ? '🍮 DESSERT STATION PREP' : PR.dept === 'kitchen' ? '🍛 HOT KITCHEN PREP' : '🔥 CONSOLIDATED BATCH PREP';
    lines.push({ t: ctr(deptTag), b: true, big: true, c: true });
    lines.push({ t: ctr(`Prep Time: ${PR.slot === 'all' ? 'ALL BATCHES' : fmtTime(PR.slot)}`), b: true, c: true });
    lines.push({ t: ctr(`Generated: ${nowStr()}`), c: true });
    lines.push({ t: dbl });

    const batches = buildBatches(PR.slot, PR.dept, UI.prepFmt, UI.prepMode);
    batches.forEach(b => {
      lines.push({ t: row(`🔥 PREP ${fmtTime(b.slot.time)}`, `DELIV ${fmtTime(b.slot.deliveryTime)}`), b: true });
      lines.push({ t: bar });
      catKeys().forEach(k => {
        if (!b.stations[k]?.length) return;
        const cat = catById(k);
        lines.push({ t: `[ ${cat.name.toUpperCase()} ]`, b: true });
        b.stations[k].forEach(r => {
          lines.push({ t: pad(`  ${r.dish.name}`, w - 8) + rpad(`${r.total} ${r.dish.unit}`, 8), b: true });
          if (S.template.showBreakdown) {
            r.alloc.forEach(a => {
              lines.push({ t: `    * [${a.format}] ${a.order.customer}: ${a.qty}` });
            });
          }
        });
        lines.push({ t: '' });
      });
    });
  }

  lines.push({ t: bar });
  S.template.footer.split('\n').forEach(l => lines.push({ t: ctr(l), c: true }));
  lines.push({ t: ctr('*** KITCHSYNC MINIMAL ESC/POS ***'), c: true });
  return lines;
}

function paperHTML(lines) {
  const w = S.printer.width === 58 ? 260 : 330;
  return `<div class="paper" style="width:${w}px">${lines.map(l => `<div class="pl ${l.b ? 'b' : ''} ${l.c ? 'c' : ''} ${l.big ? 'big' : ''}">${esc(l.t || ' ')}</div>`).join('')}</div>`;
}

function systemPrint(lines) {
  $('#print-area').innerHTML = paperHTML(lines);
  window.print();
}

/* ============================== Schema Validation & File Import (.json / .csv) ============================== */
function validateMenuStructure(parsedItems) {
  const report = { valid: true, validItems: [], errors: [], warnings: [] };
  if (!Array.isArray(parsedItems) || !parsedItems.length) {
    report.valid = false;
    report.errors.push('File does not contain an array of items.');
    return report;
  }

  const existingStations = new Set(S.categories.map(c => c.id));
  const seenSkus = new Set();

  parsedItems.forEach((it, idx) => {
    const row = idx + 1;
    if (!it.name || typeof it.name !== 'string' || !it.name.trim()) {
      report.errors.push(`Row ${row}: Missing item name.`);
      return;
    }
    const name = it.name.trim();
    let sku = it.sku ? String(it.sku).trim().toUpperCase() : '';
    if (!sku) {
      sku = `ITM-${String(row).padStart(3, '0')}`;
      report.warnings.push(`Row ${row}: Empty SKU for "${name}", auto-assigned ${sku}.`);
    }
    if (seenSkus.has(sku)) {
      report.warnings.push(`Row ${row}: Duplicate SKU "${sku}" detected.`);
    }
    seenSkus.add(sku);

    let station = it.station ? String(it.station).toLowerCase().trim() : 'ayam';
    if (!existingStations.has(station)) {
      station = 'ayam';
      report.warnings.push(`Row ${row}: Station "${it.station}" unknown, defaulted to "ayam".`);
    }

    const unit = it.unit ? String(it.unit).trim() : 'pcs';
    const isDiscontinued = Boolean(it.isDiscontinued === true || String(it.isDiscontinued).toLowerCase() === 'true');

    let aliases = [];
    if (Array.isArray(it.aliases)) aliases = it.aliases.map(a => String(a).trim()).filter(Boolean);
    else if (typeof it.aliases === 'string') aliases = it.aliases.split(/[|,\n]/).map(a => a.trim()).filter(Boolean);

    const pr = it.pricing || {};
    const pricing = {
      price: Number(pr.price ?? it.price) || 0,
      dineInM: it.dineInM !== undefined && it.dineInM !== '' ? Number(it.dineInM) : (pr.dineInM !== undefined ? Number(pr.dineInM) : null),
      takeawayM: it.takeawayM !== undefined && it.takeawayM !== '' ? Number(it.takeawayM) : (pr.takeawayM !== undefined ? Number(pr.takeawayM) : null),
      dineInL: it.dineInL !== undefined && it.dineInL !== '' ? Number(it.dineInL) : (pr.dineInL !== undefined ? Number(pr.dineInL) : null),
      takeawayL: it.takeawayL !== undefined && it.takeawayL !== '' ? Number(it.takeawayL) : (pr.takeawayL !== undefined ? Number(pr.takeawayL) : null),
    };

    report.validItems.push({
      id: uid(),
      sku, name, station, unit, isDiscontinued, pricing, aliases,
      recipe: it.recipe || []
    });
  });

  if (!report.validItems.length) report.valid = false;
  return report;
}

function parseCSVMenu(csvText) {
  const lines = csvText.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const header = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  const items = [];
  for (let i = 1; i < lines.length; i++) {
    const raw = lines[i];
    // CSV regex parser handling quotes
    const row = [];
    let field = '', inQuotes = false;
    for (let c = 0; c < raw.length; c++) {
      const ch = raw[c];
      if (inQuotes) {
        if (ch === '"') {
          if (raw[c + 1] === '"') { field += '"'; c++; }
          else inQuotes = false;
        } else field += ch;
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === ',') { row.push(field.trim()); field = ''; }
        else field += ch;
      }
    }
    row.push(field.trim());
    if (row.length >= 2 && row[1]) {
      const obj = {};
      header.forEach((h, idx) => { obj[h] = row[idx] ?? ''; });
      items.push(obj);
    }
  }
  return items;
}

$('#f-import-menu').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  try {
    const txt = await file.text();
    let rawItems = [];
    if (file.name.endsWith('.json') || txt.trim().startsWith('{') || txt.trim().startsWith('[')) {
      const parsed = JSON.parse(txt);
      rawItems = Array.isArray(parsed) ? parsed : (parsed.items || parsed.menu || []);
      if (parsed.categories && Array.isArray(parsed.categories)) {
        S.categories = parsed.categories;
      }
    } else {
      rawItems = parseCSVMenu(txt);
    }

    const report = validateMenuStructure(rawItems);
    openImportValidationModal(file.name, report);
  } catch (err) {
    toast('Import error: ' + err.message, 'err');
  }
};

function openImportValidationModal(filename, report) {
  window._valid_items = report.validItems;
  openModal(`
    <div class="mh">
      <div>
        <div class="mt">📋 Menu Master Import Validation</div>
        <div class="ms">${esc(filename)}</div>
      </div>
      <span class="spacer"></span>
      <button class="btn sm icon ghost" onclick="closeModal()">✕</button>
    </div>
    <div class="mb">
      <div class="card" style="padding:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px">
          <span>Validation Status:</span>
          ${report.valid ? '<span class="tag ok">VALID SCHEMA ✓</span>' : '<span class="tag disc">SCHEMA INVALID</span>'}
        </div>
        <div style="font-size:12px;margin-top:6px;color:var(--mu)">
          • Total items validated: <b>${report.validItems.length}</b><br>
          • Errors: <b style="color:#ef4444">${report.errors.length}</b><br>
          • Warnings: <b style="color:#f59e0b">${report.warnings.length}</b>
        </div>
      </div>

      ${report.errors.length ? `
        <div class="note" style="border-color:#ef4444;background:rgba(239,68,68,.1);color:#fca5a5;margin-bottom:8px">
          <b>Errors:</b><br>${report.errors.map(esc).join('<br>')}
        </div>` : ''}

      ${report.warnings.length ? `
        <div class="note" style="border-color:#f59e0b;background:rgba(245,158,11,.1);color:#fde047;margin-bottom:8px">
          <b>Warnings:</b><br>${report.warnings.slice(0, 8).map(esc).join('<br>')}
          ${report.warnings.length > 8 ? `<br>...and ${report.warnings.length - 8} more` : ''}
        </div>` : ''}

      <div style="font-size:12px;font-weight:700;margin-bottom:6px">Preview of items to be loaded:</div>
      <div style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg2);font-size:11px">
        ${report.validItems.slice(0, 20).map(it => `<div>• [${esc(it.sku)}] <b>${esc(it.name)}</b> (${esc(it.station)}) - $${it.pricing.price || '0'}</div>`).join('')}
        ${report.validItems.length > 20 ? `<div style="color:var(--mu);padding-top:4px">...and ${report.validItems.length - 20} more items</div>` : ''}
      </div>
    </div>
    <div class="mf">
      <button class="btn sm ghost" onclick="closeModal()">Cancel</button>
      <span class="spacer"></span>
      <button class="btn sm" onclick="applyImportedMenu(window._valid_items, false)" ${!report.valid ? 'disabled' : ''}>Merge with Existing</button>
      <button class="btn sm pri" onclick="applyImportedMenu(window._valid_items, true)" ${!report.valid ? 'disabled' : ''}>Replace Menu Master</button>
    </div>`);
  window._valid_items = report.validItems;
}

function applyImportedMenu(items, replace = false) {
  if (!items || !items.length) return;
  if (replace) {
    S.menu = items;
  } else {
    // Merge by SKU
    items.forEach(newItem => {
      const idx = S.menu.findIndex(m => m.sku === newItem.sku);
      if (idx !== -1) S.menu[idx] = newItem;
      else S.menu.push(newItem);
    });
  }
  UI.selectedMenu.clear();
  save();
  closeModal();
  renderMenuTab();
  toast(`Imported ${items.length} items to Menu Master ✓`, 'ok');
}

function exportMenu(fmt) {
  if (fmt === 'json') {
    const payload = {
      schema: 'hjh-maimunah-v23',
      exported: new Date().toISOString(),
      categories: S.categories,
      items: S.menu
    };
    return download('hjh-maimunah-menu-v23.json', JSON.stringify(payload, null, 2), 'application/json');
  }
  const q = v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const header = 'sku,name,station,unit,price,dineInM,takeawayM,dineInL,takeawayL,isDiscontinued,aliases';
  const rows = S.menu.map(m => {
    const p = m.pricing || {};
    return [
      m.sku, m.name, m.station, m.unit, p.price || 0,
      p.dineInM || '', p.takeawayM || '', p.dineInL || '', p.takeawayL || '',
      m.isDiscontinued ? 'true' : 'false',
      (m.aliases || []).join('|')
    ].map(q).join(',');
  });
  download('hjh-maimunah-menu-v23.csv', [header, ...rows].join('\n'), 'text/csv');
}

/* 2. Printer Setup Tab */

  const p = S.printer;

      <h3><span>Network Connection (Port 9100 RAW TCP)</span><span class="tag ok">Ready</span></h3>
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:8px">
        <div><label class="f">LAN IP Address</label><input class="mono" id="hw-ip" value="${esc(p.ip)}" onchange="S.printer.ip=this.value;save()"></div>
        <div><label class="f">Port</label><input class="mono" id="hw-port" type="number" value="${p.port}" onchange="S.printer.port=+this.value;save()"></div>
      </div>

        <label class="f">Paper Roll Width</label>

          <button class="${p.width === 58 ? 'on' : ''}" onclick="S.printer.width=58;save();renderHwTab()">58mm Compact (32 cols)</button>

        <div>
          <label class="sw"><input type="checkbox" ${p.autoCut ? 'checked' : ''} onchange="S.printer.autoCut=this.checked;save()"><i></i> Auto-Cut Paper</label>
        </div>

          <label class="f">Copies</label>

        </div>
      </div>
      <div style="margin-top:12px;display:flex;gap:6px">

}

function testThermalPrint() {
  toast(`Test cut packet sent to ${S.printer.ip}:${S.printer.port} ✓`, 'ok');
}

/* 3. Buffer & Lead Time Overrides Tab */
function renderSlotsTab() {
  S.buffers ||= { BSU: 120, MBC: 90, LB: 90, BB: 90, AC: 45 };
  $('#scontent').innerHTML = `
    <div class="shead"><h1>🕒 Catering Lead Time Buffers</h1></div>
    <div class="card">
      <div class="note" style="margin-bottom:10px">
        <b>Automated Prep Start Calculation:</b><br>
        Kitchen Prep Batch Start = Customer Delivery Drop-Off − Format Buffer.
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${Object.keys(FORMATS).map(k => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:8px">
            <div style="display:flex;align-items:center;gap:6px">
              ${fmtBadge(k)}
              <b>${FORMATS[k].name}</b>
            </div>
            <div style="display:flex;align-items:center;gap:4px">
              <span style="font-size:11px;color:var(--mu)">−</span>
              <input type="number" min="15" max="300" step="5" style="width:75px;min-height:32px;font-size:13px;text-align:center"
                value="${S.buffers[k] || FORMATS[k].defaultLead}"
                onchange="S.buffers['${k}']=+this.value;save();recalcAllOrderSlots();">
              <span style="font-size:11px;color:var(--mu)">mins</span>
            </div>
          </div>`).join('')}
      </div>
    </div>`;
}

function recalcAllOrderSlots() {
  S.orders.forEach(o => {
    o.slot = calcPrepTime(o.deliveryTime, o.format);
  });
  save();
  if (UI.pane === 'prep') renderPrep();
  else if (UI.pane === 'orders') renderOrders();
  toast('Lead buffers updated and active batch times recalculated ✓', 'ok');
}

/* 4. Ingestion & Matching Rules Tab */
function renderRulesTab() {
  S.ingestion ||= { minConfidence: 75, fallbackQueue: true };
  const conf = S.ingestion.minConfidence || 75;
  $('#scontent').innerHTML = `
    <div class="shead"><h1>🔍 Ingestion & Fuzzy Match Rules</h1></div>
    <div class="card">
      <h3><span>Fuzzy OCR Matching Threshold</span><span class="tag acc">${conf}%</span></h3>
      <div style="margin:10px 0">
        <input type="range" min="50" max="95" value="${conf}" style="width:100%" oninput="$('#conf-val').textContent=this.value+'%';S.ingestion.minConfidence=+this.value;save()">
        <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--mu);margin-top:2px">
          <span>50% (More lenient)</span>
          <span id="conf-val" style="font-weight:800;color:var(--tx)">${conf}%</span>
          <span>95% (Strict)</span>
        </div>
      </div>
      <div class="note">
        • Scores ≥ 95%: Auto-confirmed as <b>Exact Match</b>.<br>
        • Scores between ${conf}% and 94%: Tagged as <b>Fuzzy Match</b> with suggestions.<br>
        • Scores &lt; ${conf}%: Routed to <b>Unmapped Queue</b> for manual confirmation.
      </div>
      <div style="margin-top:12px">
        <label class="sw">
          <input type="checkbox" ${S.ingestion.fallbackQueue ? 'checked' : ''} onchange="S.ingestion.fallbackQueue=this.checked;save()">
          <i></i> <span style="font-size:12px">Require manual confirmation for Unmapped items before saving ticket</span>
        </label>
      </div>
    </div>`;
}

/* 5. Ticket Layout Tab */
function renderTplTab() {

    <div class="shead"><h1>📄 ESC/POS Ticket Template</h1></div>
    <div class="card">
      <div><label class="f">Header Title</label><input value="${esc(tpl.title)}" oninput="S.template.title=this.value;save()"></div>
      <div style="margin-top:8px"><label class="f">Address / Subheader</label><textarea rows="2" oninput="S.template.shop=this.value;save()">${esc(tpl.shop)}</textarea></div>
      <div style="margin-top:8px"><label class="f">Kitchen Footer Note</label><textarea rows="2" oninput="S.template.footer=this.value;save()">${esc(tpl.footer)}</textarea></div>

      </div>

}

/* ============================== Ingest Drag and Drop Setup ============================== */
const drop = $('#drop');
if (drop) {
  ['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', e => { if (e.dataTransfer?.files?.length) startIngest(e.dataTransfer.files); });
}

const dropall = $('#dropall');
if (dropall) {
  window.addEventListener('dragover', e => { e.preventDefault(); dropall.classList.add('drag'); });
  dropall.addEventListener('dragleave', () => dropall.classList.remove('drag'));
  dropall.addEventListener('drop', e => { e.preventDefault(); dropall.classList.remove('drag'); if (e.dataTransfer?.files?.length) startIngest(e.dataTransfer.files); });
}

$('#f-upload').onchange = e => { if (e.target.files?.length) startIngest(e.target.files); e.target.value = ''; };
$('#f-camera').onchange = e => { if (e.target.files?.length) startIngest(e.target.files); e.target.value = ''; };

/* Initialize App */
setMobilePane('prep');
</script>
